<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for kiwi-killswitchd.

  The daemon runs as root and owns eu.kiwinetwork.KillSwitch. Members of the
  `wheel` group (local admins) may call its methods WITHOUT a password. This is
  what replaces pkexec/polkit and satisfies the requirement that arming,
  disarming and configuring the kill switch never prompt for root.

  It is safe because the daemon is the only thing that touches the firewall, it
  validates every input, and the surface it exposes is exactly the methods in
  its introspection XML — not "run this program as root". Everyone outside
  `wheel` is denied: the system bus denies by default.

  Do not loosen this. In particular do not add a <policy context="default">
  allow rule — that would hand every local process on the machine the ability
  to disarm the kill switch.
-->
<busconfig>
  <policy user="root">
    <allow own="eu.kiwinetwork.KillSwitch"/>
    <!-- Root must also be able to CALL the daemon. This grants nothing new —
         root can already rewrite the config and restart the service — but
         without it the installer's readiness check fails, `install.sh
         uninstall` cannot disarm before it removes the daemon, and root has no
         way to recover from a TTY. All three fail silently, which is the worst
         possible way for a kill switch to fail. -->
    <allow send_destination="eu.kiwinetwork.KillSwitch"/>
    <allow receive_sender="eu.kiwinetwork.KillSwitch"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="eu.kiwinetwork.KillSwitch"/>
    <allow receive_sender="eu.kiwinetwork.KillSwitch"/>
  </policy>
</busconfig>
